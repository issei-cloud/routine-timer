<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>ルーティンタイマー</title>
<!-- PWA：ホーム画面に追加できるようにする -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#6E8AA6" />
<link rel="icon" href="icons/icon-192.png" />
<!-- iOS（ホーム画面追加時の見た目） -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ルーティン" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root {
    --bg:#F3F1EC; --ink:#33322D; --sub:#8A867B; --line:#E2DDD2; --card:#FBFAF6;
    --full:#7FA98B; --some:#E4C97E; --rest:#C9C3D6; --accent:#6E8AA6;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
    display:flex; justify-content:center; min-height:100vh;
  }
  #app { width:100%; max-width:460px; padding:env(safe-area-inset-top,0) 20px calc(48px + env(safe-area-inset-bottom,0)); }
  .muted { color:var(--sub); }
  .card {
    background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:20px; margin-bottom:12px;
  }
  button { font-family:inherit; cursor:pointer; }
  .primary {
    width:100%; padding:16px; background:var(--ink); color:#fff; border:none;
    border-radius:14px; font-size:16px; font-weight:700; margin-top:20px;
  }
  .primary:active { opacity:.85; }
  .ghost {
    background:transparent; border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:8px 14px; font-size:13px;
  }
  .num { font-variant-numeric:tabular-nums; }
  .fade { animation:fade .3s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .header { display:flex; align-items:center; justify-content:space-between; padding:28px 0 20px; }
  .brand { font-size:13px; letter-spacing:3px; color:var(--sub); }
  .routine-pick {
    width:100%; text-align:left; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:18px 20px; margin-bottom:12px; display:flex;
    align-items:center; gap:14px;
  }
  .routine-pick:active { border-color:var(--accent); }
  .pick-emoji { font-size:26px; }
  .progress-wrap { height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:24px; }
  .progress-bar { height:100%; background:var(--accent); transition:width .3s; }
  .big-num { font-size:64px; font-weight:700; }
  .img-frame {
    background:var(--bg); border-radius:14px; height:180px; display:grid;
    place-items:center; color:var(--sub); margin-bottom:8px; position:relative;
  }
  .dots { display:flex; gap:6px; justify-content:center; margin-bottom:16px; }
  .dot { width:8px; height:8px; border-radius:50%; border:none; background:var(--line); }
  .dot.on { background:var(--accent); }
  .toggle-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .switch { width:34px; height:20px; border-radius:20px; background:var(--line); position:relative; flex-shrink:0; transition:background .2s; }
  .switch.on { background:var(--accent); }
  .knob { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .2s; }
  .switch.on .knob { left:16px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-cell { aspect-ratio:1; display:grid; place-items:center; border-radius:10px; font-size:13px; border:1px solid var(--line); }
  .legend { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:18px 0 6px; }
  .legend span { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); }
  .swatch { width:12px; height:12px; border-radius:50%; }
  /* BGM選択チップ */
  .bgm-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .bgm-chip {
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:12px; padding:9px 13px; font-size:13px; display:flex;
    align-items:center; gap:7px; transition:all .15s;
  }
  .bgm-chip.on { border-color:var(--accent); background:#EEF2F6; }
  .bgm-chip .ic { font-size:15px; }
  .bgm-chip.disabled { opacity:.4; pointer-events:none; }
  .bgm-chip.yt .ic { color:#C0392B; font-size:11px; }
  .bgm-chip.add { border-style:dashed; color:var(--sub); }
  .chip-x {
    margin-left:4px; width:16px; height:16px; border-radius:50%;
    display:inline-grid; place-items:center; font-size:12px;
    background:rgba(0,0,0,.06); color:var(--sub);
  }
  .chip-x:active { background:rgba(0,0,0,.14); }
  .preview-hint { font-size:11px; color:var(--sub); margin-top:8px; }
  /* 編集画面 */
  .ex-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .ex-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .field { border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; font-family:inherit; color:var(--ink); background:#fff; width:100%; }
  .field:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { border:none; background:#fff; padding:8px 14px; font-size:13px; color:var(--sub); }
  .seg button.on { background:var(--accent); color:#fff; }
  .mini { background:transparent; border:1px solid var(--line); border-radius:8px; width:34px; height:34px; font-size:16px; color:var(--ink); display:grid; place-items:center; }
  .mini:disabled { opacity:.3; }
  .lbl { font-size:12px; color:var(--sub); margin-bottom:4px; display:block; }
  .img-thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .thumb { width:62px; height:62px; border-radius:10px; background:var(--bg); border:1px solid var(--line); position:relative; display:grid; place-items:center; overflow:hidden; background-size:cover; background-position:center; }
  .thumb .x { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid var(--line); font-size:12px; color:var(--sub); display:grid; place-items:center; }
  .thumb-add { width:62px; height:62px; border-radius:10px; border:1px dashed var(--line); background:transparent; color:var(--sub); font-size:22px; }
  .thumb-label { font-size:9px; color:var(--sub); position:absolute; bottom:2px; max-width:58px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; background:rgba(255,255,255,.7); border-radius:4px; padding:0 2px; }
  .drag-handle { font-size:18px; color:var(--sub); cursor:grab; width:22px; text-align:center; touch-action:none; user-select:none; line-height:1; }
  .sound-disabled > div:not(:first-child), .sound-disabled .bgm-list, .sound-disabled .preview-hint { opacity:.35; pointer-events:none; }
  #flash { position:fixed; inset:0; background:var(--accent); opacity:0; pointer-events:none; z-index:9999; transition:opacity .9s ease; }
  #flash.flash-on { opacity:.55; transition:none; }
  .up-next { background:#EEF2F6; border-radius:12px; padding:9px 14px; font-size:13px; color:var(--sub); margin-bottom:14px; text-align:center; }
  .up-next strong { color:var(--ink); }
  .ex-row { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .ex-row.dragging { opacity:.5; }
  .ex-row.drag-over { border-color:var(--accent); box-shadow:0 0 0 2px rgba(110,138,166,.25); }
  .ex-card.dragging { opacity:.5; }
  .ex-card.drag-over { border-color:var(--accent); box-shadow:0 0 0 2px rgba(110,138,166,.25); }
</style>
</head>
<body>
<div id="app"></div>
<!-- YouTube BGM用の隠しプレイヤー（音だけ使用。画面外に固定） -->
<div id="yt-host" style="position:fixed; left:-9999px; top:-9999px; width:200px; height:120px;" aria-hidden="true"></div>

<script>
// ============ データ（複数ルーティン） ============
// 画像は {src, label} の配列。src は dataURL（未登録ならnull＝枠のみ表示）、label は説明。
function img(label){ return { src:null, label }; }
function defaultRoutines(){
  return [
    {
      id:"morning", name:"朝のリセット", emoji:"🌅",
      items:[
        { id:"e1", name:"首まわりストレッチ", mode:"time", value:30, rest:5,  imgs:[img("開始姿勢"),img("倒した姿勢")] },
        { id:"e2", name:"肩甲骨まわし",       mode:"reps", value:10, rest:10, imgs:[img("前まわし"),img("後ろまわし")] },
        { id:"e3", name:"プランク",           mode:"time", value:20, rest:15, imgs:[img("キープ姿勢")] },
        { id:"e4", name:"股関節ストレッチ",   mode:"time", value:40, rest:0,  imgs:[img("開始"),img("深めた姿勢")] },
      ],
    },
    {
      id:"night", name:"夜のほぐし", emoji:"🌙",
      items:[
        { id:"e5", name:"深呼吸",             mode:"time", value:20, rest:5,  imgs:[img("吸う"),img("吐く")] },
        { id:"e6", name:"前屈ストレッチ",     mode:"time", value:30, rest:10, imgs:[img("開始"),img("深めた姿勢")] },
        { id:"e7", name:"腿裏のばし",         mode:"time", value:30, rest:0,  imgs:[img("左脚"),img("右脚")] },
      ],
    },
    {
      id:"quick", name:"さっと筋トレ", emoji:"⚡",
      items:[
        { id:"e8",  name:"スクワット",        mode:"reps", value:15, rest:15, imgs:[img("立ち"),img("しゃがみ")] },
        { id:"e9",  name:"腕立て伏せ",        mode:"reps", value:10, rest:15, imgs:[img("開始"),img("下げた姿勢")] },
        { id:"e10", name:"プランク",          mode:"time", value:30, rest:0,  imgs:[img("キープ姿勢")] },
      ],
    },
  ];
}
let ROUTINES = defaultRoutines();
const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const STATUS = {
  full:{ label:"しっかりできた", color:"var(--full)" },
  some:{ label:"少しできた",     color:"var(--some)" },
  rest:{ label:"休息の日",       color:"var(--rest)" },
};

// BGMの種類（合成音で雰囲気を作り分け）
const BGMS = [
  { id:"warm",  name:"ぬくもり", ic:"🫧", hint:"やわらかい和音のパッド" },
  { id:"zen",   name:"しずく",   ic:"💧", hint:"静かに落ちる澄んだ単音" },
  { id:"waves", name:"なみ",     ic:"🌊", hint:"寄せては返す波のような音" },
  { id:"night", name:"ほしぞら", ic:"🌌", hint:"低い持続音とまばらな鐘" },
];

// ============ 永続化（localStorage） ============
const SKEY = "routine-timer-v1";
let log = {};                                   // 'YYYY-MM-DD' -> 'full'|'some'
let sound = { chime:true, bgm:true, bgmId:"warm", musicMode:false };
let ytList = [];                                 // [{id, title, videoId}] ユーザー登録のYouTube BGM
function loadState(){
  try {
    const raw = localStorage.getItem(SKEY);
    if(raw){ const s=JSON.parse(raw); log=s.log||{}; sound={...sound, ...(s.sound||{})}; ytList=s.ytList||[]; if(s.routines&&s.routines.length) ROUTINES=s.routines.map(normalizeRoutine); }
  } catch(e){ /* プライベートモード等では保存なしで続行 */ }
}
// 保存データを現行の形に整える（古い画像形式や欠けたidを補正）
function normalizeRoutine(r){
  r.id = r.id || uid();
  r.items = (r.items||[]).map(it=>{
    it.id = it.id || uid();
    it.imgs = (it.imgs||[]).map(im => typeof im==="string" ? { src:null, label:im } : { src:im.src||null, label:im.label||"" });
    return it;
  });
  return r;
}
function saveState(){
  try { localStorage.setItem(SKEY, JSON.stringify({ log, sound, ytList, routines:ROUTINES })); }
  catch(e){ alert("保存できませんでした。画像が多すぎる可能性があります（端末の保存上限）。"); }
}

// YouTubeのURL/IDから videoId を取り出す
function parseYouTubeId(input){
  if(!input) return null;
  const s=input.trim();
  // 生のID（11文字）
  if(/^[\w-]{11}$/.test(s)) return s;
  try {
    const u=new URL(s);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1,12) || null;
    if(u.hostname.includes("youtube.com")){
      const v=u.searchParams.get("v");
      if(v) return v;
      const m=u.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
      if(m) return m[2];
    }
  } catch(e){ /* URLでない */ }
  return null;
}

let state = { screen:"home", routineId:null };
const app = document.getElementById("app");
const todayKey = () => {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const getRoutine = () => ROUTINES.find(r=>r.id===state.routineId);

// ============ 合成音エンジン（Web Audio） ============
let _ctx=null;
function ctx(){ if(!_ctx) _ctx=new (window.AudioContext||window.webkitAudioContext)(); if(_ctx.state==="suspended")_ctx.resume(); return _ctx; }

// ユーザー操作のたびにAudioContextを起こしておく（モバイルの自動再生制限対策）。
// これを実行開始ボタン等で呼んでおくと、以降の自動チャイムが確実に鳴る。
function unlockAudio(){
  const c=ctx();
  if(c.state==="suspended") c.resume();
  // 無音の極短サンプルを一度鳴らしてアンロックを確定させる
  try {
    const o=c.createOscillator(), g=c.createGain();
    g.gain.value=0; o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime+0.01);
  } catch(e){}
}

// 区切りの通知音：はっきり聞こえる3音チャイム。
// YouTube等のBGMが鳴っていても埋もれないよう、少し強め・高めに。
function playChime(){
  const c=ctx();
  if(c.state==="suspended") c.resume();   // 念のため毎回起こす
  const seq=[784,988,1319];               // G5-B5-E6 の明るい上昇
  seq.forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type="triangle"; o.frequency.value=f;   // triangleはsineより通りやすい
    const t=c.currentTime+i*0.12;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.5,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.45);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.5);
  });
}

// 区切りの合図：音楽モードなら音を出さず、画面フラッシュ＋バイブで知らせる。
// 通常モードなら（区切り音がオンのとき）チャイムを鳴らす。
function cueBreak(){
  if(sound.musicMode){
    flashScreen();
    try { if(navigator.vibrate) navigator.vibrate([120,60,120]); } catch(e){}
  } else if(sound.chime){
    playChime();
  }
}
// 画面を一瞬光らせる（オーバーレイをフェードで重ねる）
function flashScreen(){
  let f=document.getElementById("flash");
  if(!f){ f=document.createElement("div"); f.id="flash"; document.body.appendChild(f); }
  f.className="flash-on";
  // 強制的にリフロー後にフェードアウト
  void f.offsetWidth;
  f.className="";
}

// --- BGM：id ごとに異なる作りの持続音。stop() を持つオブジェクトを返す ---
function makeBgm(id){
  const c=ctx();
  const master=c.createGain(); master.gain.value=0; master.connect(c.destination);
  const nodes=[]; const timers=[];
  const stopFns=[];

  function fadeInTo(v){ master.gain.linearRampToValueAtTime(v, c.currentTime+1.2); }

  if(id==="warm"){
    // 暖かいパッド和音＋ゆらぎ
    [220,277.18,329.63].forEach(f=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=f; g.gain.value=0.12;
      const lfo=c.createOscillator(), lg=c.createGain();
      lfo.frequency.value=0.08; lg.gain.value=3; lfo.connect(lg).connect(o.frequency); lfo.start();
      o.connect(g).connect(master); o.start();
      nodes.push(o,lfo);
    });
    fadeInTo(0.5);
  }
  else if(id==="zen"){
    // 静かな持続音を薄く敷き、澄んだ単音を不規則に落とす
    const drone=c.createOscillator(), dg=c.createGain();
    drone.type="sine"; drone.frequency.value=164.81; dg.gain.value=0.05;
    drone.connect(dg).connect(master); drone.start(); nodes.push(drone);
    const notes=[523.25,587.33,659.25,783.99,880]; // 落ち着いたペンタトニック
    const drop=()=>{
      const f=notes[Math.floor(Math.random()*notes.length)];
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=f;
      const t=c.currentTime;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.18,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+2.2);
      o.connect(g).connect(master); o.start(t); o.stop(t+2.3);
      timers.push(setTimeout(drop, 1800+Math.random()*2600));
    };
    timers.push(setTimeout(drop, 600));
    fadeInTo(0.7);
  }
  else if(id==="waves"){
    // ホワイトノイズをローパス＋ゆっくりした音量の満ち引きで波に
    const buf=c.createBuffer(1, c.sampleRate*2, c.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=500;
    const swell=c.createGain(); swell.gain.value=0.15;
    // 波の満ち引き（音量LFO）
    const lfo=c.createOscillator(), lg=c.createGain();
    lfo.type="sine"; lfo.frequency.value=0.12; lg.gain.value=0.12;
    lfo.connect(lg).connect(swell.gain); lfo.start();
    src.connect(lp).connect(swell).connect(master); src.start();
    nodes.push(lfo); stopFns.push(()=>{try{src.stop()}catch(e){}});
    fadeInTo(0.8);
  }
  else if(id==="night"){
    // 低い持続音＋まばらに澄んだ鐘
    const drone=c.createOscillator(), dg=c.createGain();
    drone.type="sine"; drone.frequency.value=110; dg.gain.value=0.08;
    drone.connect(dg).connect(master); drone.start(); nodes.push(drone);
    const drone2=c.createOscillator(), dg2=c.createGain();
    drone2.type="sine"; drone2.frequency.value=164.81; dg2.gain.value=0.05;
    drone2.connect(dg2).connect(master); drone2.start(); nodes.push(drone2);
    const bells=[987.77,1174.66,1318.51];
    const ring=()=>{
      const f=bells[Math.floor(Math.random()*bells.length)];
      const o=c.createOscillator(), g=c.createGain();
      o.type="triangle"; o.frequency.value=f;
      const t=c.currentTime;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.1,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+3);
      o.connect(g).connect(master); o.start(t); o.stop(t+3);
      timers.push(setTimeout(ring, 3500+Math.random()*4000));
    };
    timers.push(setTimeout(ring, 1200));
    fadeInTo(0.6);
  }

  return {
    stop(){
      master.gain.linearRampToValueAtTime(0, c.currentTime+0.8);
      timers.forEach(clearTimeout);
      setTimeout(()=>{
        nodes.forEach(n=>{try{n.stop()}catch(e){}});
        stopFns.forEach(fn=>fn());
      }, 900);
    }
  };
}

// ---- YouTube IFrame API（音だけBGMとして利用。遅延読み込み） ----
let ytPlayer=null, ytReady=false, ytPending=null;
function loadYouTubeApi(){
  if(window.YT && window.YT.Player){ ytReady=true; return; }
  if(document.getElementById("yt-api")) return;
  const tag=document.createElement("script");
  tag.id="yt-api"; tag.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady=function(){
  ytReady=true;
  ytPlayer=new YT.Player("yt-host",{
    height:"120", width:"200",
    playerVars:{ autoplay:0, controls:0, disablekb:1, loop:1, playsinline:1 },
    events:{
      onReady:()=>{ if(ytPending){ const v=ytPending; ytPending=null; playYt(v); } },
      onStateChange:(e)=>{ if(e.data===YT.PlayerState.ENDED && ytPlayer){ ytPlayer.seekTo(0); ytPlayer.playVideo(); } }
    }
  });
};
function playYt(videoId){
  if(!ytReady || !ytPlayer || !ytPlayer.loadVideoById){ ytPending=videoId; loadYouTubeApi(); return; }
  ytPlayer.loadVideoById({ videoId });
  ytPlayer.playVideo();
}
function stopYt(){ if(ytPlayer && ytPlayer.stopVideo){ try{ ytPlayer.stopVideo(); }catch(e){} } ytPending=null; }

// ---- BGM統一制御：合成音(id) と YouTube(yt:<videoId>) を同じ入口で ----
let bgm=null;
function isYt(id){ return typeof id==="string" && id.startsWith("yt:"); }
function startBgm(){
  if(isYt(sound.bgmId)){ playYt(sound.bgmId.slice(3)); }
  else { bgm=makeBgm(sound.bgmId); }
}
function stopBgm(){ if(bgm){ bgm.stop(); bgm=null; } stopYt(); }

// プレビュー再生（ホームで試聴）：合成音は数秒で自動停止、YouTubeは次の操作まで
let preview=null, previewTimer=null;
function previewBgm(id){
  stopPreview();
  sound.bgmId=id; saveState();
  if(isYt(id)){ playYt(id.slice(3)); }        // 試聴＝そのまま再生（別BGM選択やホーム操作で停止）
  else { preview=makeBgm(id); previewTimer=setTimeout(stopPreview, 6000); }
  render();
}
function stopPreview(){
  if(preview){ preview.stop(); preview=null; }
  if(previewTimer){ clearTimeout(previewTimer); previewTimer=null; }
  stopYt();
}

// ============ 画面描画 ============
function render(){
  if(state.screen==="home") renderHome();
  else if(state.screen==="run") renderRun();
  else if(state.screen==="done") renderDone();
  else if(state.screen==="calendar") renderCalendar();
  else if(state.screen==="edit") renderEdit();
}

    <button class="ghost" style="opacity:${active==="calendar"?1:.6}" onclick="go('calendar')">記録を見る</button>
  </div>`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toggleHTML(key,label,hint){

    <div class="toggle-row">

    </div>
    <div class="muted" style="font-size:11px; padding-left:42px">${hint}</div>
  </button>`;
}
function toggleSound(k){
  sound[k]=!sound[k];
  if(k==="bgm"&&!sound[k]) stopPreview();
  if(k==="musicMode"&&sound[k]) stopPreview();   // 音楽モードonで試聴中の音を止める
  saveState(); render();
}

// ---- YouTube BGM 追加 / 削除 ----
function openAddYt(){
  if(!sound.bgm) return;
  stopPreview();
  const url = prompt("ヒーリングBGMにしたいYouTubeのURL（または動画ID）を貼り付けてください");
  if(!url) return;
  const videoId = parseYouTubeId(url);
  if(!videoId){ alert("YouTubeのURLが読み取れませんでした。動画ページのURLを貼り付けてください。"); return; }
  if(ytList.some(y=>y.videoId===videoId)){ alert("この動画はすでに追加されています。"); sound.bgmId="yt:"+videoId; saveState(); render(); return; }
  const title = prompt("名前をつけてください（例：雨の音、波の音）", "マイBGM") || "マイBGM";
  const entry = { id:"yt"+Date.now(), title:title.slice(0,20), videoId };
  ytList.push(entry);
  sound.bgmId="yt:"+videoId;        // 追加したものを選択状態に
  saveState(); render();
  previewBgm("yt:"+videoId);        // そのまま試聴
}
function removeYt(ev, id){
  ev.stopPropagation();
  const y=ytList.find(y=>y.id===id);
  if(!y) return;
  if(!confirm(`「${y.title}」を削除しますか？`)) return;
  ytList=ytList.filter(x=>x.id!==id);
  if(sound.bgmId==="yt:"+y.videoId){ sound.bgmId="warm"; stopPreview(); }
  saveState(); render();
}

// ---- 実行画面 ----
let run = null;
const RUN_KEY = "routine-timer-run";   // 中断復帰用に進行状況を保存

function buildSteps(r){
  const steps=[];
  r.items.forEach(it=>{ steps.push({type:"ex",data:it}); if(it.rest>0) steps.push({type:"rest",secs:it.rest}); });
  return steps;
}
function start(id, resume){
  stopPreview();
  // 音楽モード中はアプリの音を一切出さない（Apple Music等を止めないため）
  if(!sound.musicMode) unlockAudio();
  state.routineId=id; state.screen="run";
  const r=getRoutine();
  const steps=buildSteps(r);
  if(resume && resume.routineId===id && resume.idx<steps.length){
    run={ steps, idx:resume.idx, remain:resume.remain, imgIdx:resume.imgIdx||0, timer:null, paused:true };
  } else {
    run={ steps, idx:0, remain:null, imgIdx:0, timer:null, paused:false };
  }
  if(sound.bgm && !sound.musicMode && !run.paused) startBgm();
  render();
  if(run.paused) renderRun();         // 復帰時は一時停止状態で表示（ユーザーが再開を押す）
  else enterStep();
}
function go(s){
  if(run&&run.timer) clearInterval(run.timer);
  if(s!=="run"){ stopBgm(); }
  state.screen=s; render();
}
// 中断（やめる）：進行状況を保存してホームへ
function quitRun(){
  if(run){ saveRunProgress(); if(run.timer) clearInterval(run.timer); }
  stopBgm();
  state.screen="home"; render();
}
function saveRunProgress(){
  try {
    const step=run.steps[run.idx];
    // 回数種目は残り時間の概念がないのでremainはnull保存でOK
    localStorage.setItem(RUN_KEY, JSON.stringify({
      routineId: state.routineId, idx: run.idx, imgIdx: run.imgIdx,
      remain: (step && (step.type==="rest"||step.data.mode==="time")) ? run.remain : null,
      at: Date.now()
    }));
  } catch(e){}
}
function clearRunProgress(){ try{ localStorage.removeItem(RUN_KEY); }catch(e){} }
function getRunProgress(){
  try { const r=JSON.parse(localStorage.getItem(RUN_KEY)||"null"); return r; } catch(e){ return null; }
}

function enterStep(){
  clearInterval(run.timer);
  run.paused=false;
  const step=run.steps[run.idx];
  const timed = step.type==="rest" || (step.type==="ex"&&step.data.mode==="time");
  if(!timed){ run.remain=null; render(); return; }
  if(run.remain==null) run.remain = step.type==="rest" ? step.secs : step.data.value;
  render();
  tick();
}
function tick(){
  clearInterval(run.timer);
  run.timer=setInterval(()=>{
    if(run.paused) return;
    run.remain--;
    if(run.remain<=0){ clearInterval(run.timer); setTimeout(()=>next(true),200); }
    updateTimerText();
    saveRunProgress();
  },1000);
}
function updateTimerText(){ const el=document.getElementById("timer"); if(el) el.textContent=Math.max(run.remain,0); }

// 一時停止 / 再開
function togglePause(){
  if(!run) return;
  run.paused=!run.paused;
  if(run.paused){ stopBgm(); }
  else { if(!sound.musicMode){ unlockAudio(); if(sound.bgm) startBgm(); }
    const step=run.steps[run.idx];
    const timed = step.type==="rest" || (step.type==="ex"&&step.data.mode==="time");
    if(timed && (run.timer==null)) tick();
  }
  renderRun();
}

function next(cue){
  if(cue) cueBreak();   // 区切りの合図（音楽モードならフラッシュ＋バイブ、通常ならチャイム）
  if(run.idx+1>=run.steps.length){ stopBgm(); clearRunProgress(); state.screen="done"; render(); return; }
  run.idx++; run.imgIdx=0; run.remain=null; saveRunProgress(); enterStep();
}
function setImg(i){ run.imgIdx=i; render(); }

// 「続きから」
function resumeRun(){
  const prog=getRunProgress();
  if(!prog){ render(); return; }
  start(prog.routineId, prog);
}
function discardResume(){ clearRunProgress(); render(); }

// 実行中に次の種目名を得る（休憩は飛ばして次の「種目」を探す）
function nextExerciseName(){
  for(let j=run.idx+1;j<run.steps.length;j++){
    if(run.steps[j].type==="ex") return run.steps[j].data.name;
  }
  return null;
}

function renderRun(){
  const step=run.steps[run.idx];
  const progress=Math.round((run.idx/run.steps.length)*100);
  // 種目番号（休憩を除いた数え方）
  const totalEx = run.steps.filter(s=>s.type==="ex").length;
  const curExNo = run.steps.slice(0,run.idx+1).filter(s=>s.type==="ex").length;
  const nextName = nextExerciseName();
  const paused = run.paused;

  // 次の種目予告バー
  const upNext = nextName
    ? `<div class="up-next">次は <strong>${escapeHtml(nextName)}</strong></div>`
    : `<div class="up-next">次で最後の種目が終わります</div>`;

  let body;
  if(step.type==="rest"){
    body=`<div class="card" style="text-align:center; padding:40px 24px">
      <div class="muted" style="letter-spacing:2px; font-size:13px; margin-bottom:16px">ひと休み</div>
      <div class="big-num num" id="timer">${run.remain}</div>
      <div class="muted" style="font-size:13px; margin-top:12px">${nextName?`まもなく「${escapeHtml(nextName)}」`:"次に備えて呼吸を整えて"}</div>
    </div>`;
  } else {
    const d=step.data;
    const imgs = d.imgs || [];
    const cur = imgs[run.imgIdx];
    const frame = (cur && cur.src)
      ? `<div class="img-frame" style="background-image:url('${cur.src}'); background-size:cover; background-position:center">
           ${cur.label ? `<span style="position:absolute; bottom:8px; background:rgba(0,0,0,.45); color:#fff; font-size:11px; padding:2px 8px; border-radius:10px">${escapeHtml(cur.label)}</span>` : ""}
         </div>`
      : `<div class="img-frame">
           <span style="font-size:14px">🖼 ${cur ? escapeHtml(cur.label||"動作イメージ") : "動作イメージ"}</span>
           <span class="muted" style="position:absolute; bottom:8px; font-size:11px">画像は編集画面から登録できます</span>
         </div>`;
    const dots = imgs.length>1 ? `<div class="dots">${imgs.map((_,i)=>`<button class="dot ${i===run.imgIdx?"on":""}" onclick="setImg(${i})"></button>`).join("")}</div>` : "";
    const main = d.mode==="time"
      ? `<div style="text-align:center; margin:20px 0 8px"><div class="big-num num" id="timer">${run.remain}</div><div class="muted" style="font-size:13px">秒 ・ 自動で次へ</div></div>`
      : `<div style="text-align:center; margin:20px 0"><div style="font-size:40px; font-weight:700">${d.value}<span style="font-size:18px">回</span></div><button class="primary" style="margin-top:16px" onclick="next(true)">できた → 次へ</button></div>`;
    body=`<div class="card">
      ${frame}
      ${dots}
      <div style="font-size:22px; font-weight:700; text-align:center; margin-top:12px">${escapeHtml(d.name)}</div>
      ${main}
    </div>`;
  }

  // 時間系ステップのみ一時停止ボタンを出す（回数種目は手動で進むため不要）
  const timed = step.type==="rest" || (step.type==="ex"&&step.data.mode==="time");
  const pauseBtn = timed
    ? `<button class="ghost" style="flex:1; padding:12px" onclick="togglePause()">${paused?"▶ 再開":"⏸ 一時停止"}</button>`
    : "";

  app.innerHTML = `<div class="fade">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px; margin-bottom:8px">
      <span class="muted" style="font-size:12px">種目 ${curExNo} / ${totalEx}${sound.musicMode?" ・ ♪ 音楽と一緒":""}</span>
      ${paused?`<span style="font-size:12px; color:var(--accent); font-weight:700">一時停止中</span>`:""}
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>
    ${upNext}
    ${body}
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="ghost" style="flex:1; padding:12px" onclick="quitRun()">中断</button>
      ${pauseBtn}
      <button class="ghost" style="flex:1; padding:12px" onclick="next(false)">スキップ</button>
    </div>
    <p class="muted" style="text-align:center; font-size:11px; margin-top:10px">中断しても、次に開くと続きから再開できます</p>
  </div>`;
}

function save(s){ log[todayKey()]=s; saveState(); go("calendar"); }

// ---- カレンダー ----
function renderCalendar(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  const cells=[...Array(first).fill(null), ...Array.from({length:days},(_,i)=>i+1)];
  const grid = cells.map(d=>{
    if(!d) return `<div></div>`;
    const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const st=log[key], isToday=d===now.getDate(), isPast=d<now.getDate();
    const bg = st ? STATUS[st].color : (isPast ? "var(--rest)" : "transparent");
    const filled = !!st || isPast;
    return `<div class="cal-cell" style="
      background:${bg}; opacity:${st?1:(isPast?.5:1)};
      border:${isToday?"1.5px solid var(--accent)":"1px solid var(--line)"};
      color:${filled?"#fff":"var(--sub)"}; font-weight:${st?700:400}">${d}</div>`;
  }).join("");
  const legend = Object.values(STATUS).map(v=>`<span><span class="swatch" style="background:${v.color}"></span>${v.label}</span>`).join("");
  app.innerHTML = headerHTML("calendar") + `<div class="fade">
    <div style="font-size:20px; font-weight:700; margin-bottom:4px">${y}年 ${m+1}月</div>
    <p class="muted" style="font-size:13px; margin:0 0 20px">続いていること、それ自体がいいこと。</p>
    <div class="card">
      <div class="cal-grid" style="margin-bottom:8px">${["日","月","火","水","木","金","土"].map(d=>`<div style="text-align:center; font-size:11px; color:var(--sub)">${d}</div>`).join("")}</div>
      <div class="cal-grid">${grid}</div>
    </div>
    <div class="legend">${legend}</div>
    <p class="muted" style="text-align:center; font-size:11px; margin:0 0 24px">休息の日は選ぶものではなく、開かなかった日にそっと残ります。</p>
    <button class="primary" onclick="go('home')">ホームへ</button>
  </div>`;
}

// ============ 編集画面 ============
let editing = null;   // 編集中ルーティンのディープコピー
const EMOJIS = ["🌅","🌙","⚡","🧘","🏃","💪","🌿","☀️","🌊","⭐"];

let expanded = new Set();   // 展開中（フォームを開いている）種目idの集合
function openEdit(id){
  stopPreview();
  if(id==="new"){
    editing = { id:uid(), name:"新しいルーティン", emoji:"🌿", items:[ newExercise() ] };

function toggleExpand(id){ if(expanded.has(id)) expanded.delete(id); else expanded.add(id); render(); }
function toggleAllExpand(){

  else expanded = new Set(editing.items.map(it=>it.id));

function newExercise(){ return { id:uid(), name:"", mode:"time", value:30, rest:10, imgs:[] }; }

    // 折りたたみ時：テーブル状の1行（ドラッグ可・編集ボタンつき）
    if(!expanded.has(it.id)){
      return `<div class="ex-row" data-idx="${idx}">
        <span class="drag-handle" onpointerdown="dragStart(event,${idx})" title="ドラッグで並べ替え">⠿</span>
        <span class="muted" style="font-size:12px; width:18px; text-align:center">${idx+1}</span>
        <span style="flex:1; min-width:0">
          <div style="font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${escapeHtml(it.name||"（名称未設定）")}</div>
          <div class="muted" style="font-size:11px">${summary}${restTxt}${imgTxt}</div>
        </span>
        <button class="ghost" style="padding:6px 12px; font-size:12px" onclick="toggleExpand('${it.id}')">編集</button>
      </div>`;
    }

    // 展開時：フル編集フォーム
    const thumbs = it.imgs.map((im,i)=>`
      <div class="thumb" style="${im.src?`background-image:url('${im.src}')`:""}">
        ${im.src?"":`<span style="font-size:10px; color:var(--sub); padding:2px; text-align:center">${escapeHtml(im.label||"")}</span>`}
        <span class="x" onclick="removeImg(${idx},${i})">×</span>
      </div>`).join("");
    const valueField = it.mode==="time"
      ? `<div style="flex:1"><label class="lbl">時間（秒）</label>
          <div class="row" style="margin-top:0">
            <button class="mini" onclick="bump(${idx},'value',-5)">−</button>
            <input class="field" style="text-align:center" type="number" min="1" value="${it.value}" onchange="setField(${idx},'value',this.value)">
            <button class="mini" onclick="bump(${idx},'value',5)">＋</button>
          </div></div>`
      : `<div style="flex:1"><label class="lbl">回数</label>
          <div class="row" style="margin-top:0">
            <button class="mini" onclick="bump(${idx},'value',-1)">−</button>
            <input class="field" style="text-align:center" type="number" min="1" value="${it.value}" onchange="setField(${idx},'value',this.value)">
            <button class="mini" onclick="bump(${idx},'value',1)">＋</button>
          </div></div>`;
    return `<div class="ex-card" data-idx="${idx}">
      <div class="ex-head">
        <span class="drag-handle" onpointerdown="dragStart(event,${idx})" title="ドラッグで並べ替え">⠿</span>
        <span class="muted" style="font-size:12px; width:18px">${idx+1}</span>
        <input class="field" value="${escapeHtml(it.name)}" placeholder="種目名" onchange="setField(${idx},'name',this.value)">
        <button class="ghost" style="padding:6px 10px; font-size:12px" onclick="toggleExpand('${it.id}')">閉じる</button>
      </div>

      <div class="row" style="margin-top:4px">
        <div class="seg">
          <button class="${it.mode==="time"?"on":""}" onclick="setMode(${idx},'time')">時間</button>
          <button class="${it.mode==="reps"?"on":""}" onclick="setMode(${idx},'reps')">回数</button>
        </div>
      </div>

      <div class="row">
        ${valueField}
        <div style="flex:1"><label class="lbl">後の休憩（秒）</label>
          <div class="row" style="margin-top:0">
            <button class="mini" onclick="bump(${idx},'rest',-5)">−</button>
            <input class="field" style="text-align:center" type="number" min="0" value="${it.rest}" onchange="setField(${idx},'rest',this.value)">
            <button class="mini" onclick="bump(${idx},'rest',5)">＋</button>
          </div></div>
      </div>

      <label class="lbl" style="margin-top:12px">動作の画像（複数可・タップで追加）</label>
      <div class="img-thumbs">
        ${thumbs}
        <button class="thumb-add" onclick="pickImg(${idx})">＋</button>
      </div>

      <div class="row" style="margin-top:14px; justify-content:flex-end">
        <button class="ghost" style="color:#B4524B; border-color:#E6C9C5" onclick="removeEx(${idx})">この種目を削除</button>
      </div>
    </div>`;
  }).join("");

  app.innerHTML = `<div class="fade">
    <div class="header">
      <button class="ghost" onclick="cancelEdit()">← もどる</button>
      <button class="ghost" style="opacity:1" onclick="saveEdit()">保存</button>
    </div>
    <label class="lbl">ルーティン名</label>
    <input class="field" value="${escapeHtml(e.name)}" onchange="setName(this.value)">
    <label class="lbl" style="margin-top:12px">アイコン</label>
    <div class="row" style="flex-wrap:wrap; margin-top:4px">${emojiPicker}</div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin:22px 0 6px">
      <p style="font-size:13px; font-weight:700; letter-spacing:1px; margin:0">種目（${e.items.length}）</p>
      <button class="ghost" style="padding:5px 10px; font-size:11px" onclick="toggleAllExpand()">${expanded.size>0?"すべて閉じる":"すべて開く"}</button>
    </div>
    <p class="muted" style="font-size:11px; margin:0 0 10px">⠿ をつかんでスライドで並べ替え ・ 各種目の「編集」で詳細を変更</p>
    ${cards}
    <button class="routine-pick" style="justify-content:center; border-style:dashed; color:var(--sub); margin-top:4px" onclick="addEx()">＋ 種目を追加</button>

    <button class="primary" onclick="saveEdit()">保存してもどる</button>
    <button class="ghost" style="width:100%; padding:12px; margin-top:10px" onclick="cancelEdit()">変更を破棄</button>
    ${ROUTINES.some(r=>r.id===e.id) ? `<button class="ghost" style="width:100%; padding:12px; margin-top:18px; color:#B4524B; border-color:#E6C9C5" onclick="deleteRoutine()">このルーティンを削除</button>` : ""}
  </div>`;
}

// ルーティンごと削除
function deleteRoutine(){
  if(ROUTINES.length<=1){ alert("ルーティンは最低1つ必要です。"); return; }
  if(!confirm(`「${editing.name}」を削除しますか？\nこの操作は取り消せません。`)) return;
  ROUTINES = ROUTINES.filter(r=>r.id!==editing.id);
  saveState();
  editing=null; state.screen="home"; render();
}

// 編集操作（editing を書き換えて再描画。保存時にROUTINESへ反映）
function setName(v){ editing.name=v.trim()||"無題のルーティン"; }
function setEmoji(em){ editing.emoji=em; render(); }
function setField(idx,key,v){
  if(key==="name"){ editing.items[idx].name=v; }
  else { let n=parseInt(v,10); if(isNaN(n)) n=0; editing.items[idx][key]=Math.max(key==="rest"?0:1,n); render(); }
}
function bump(idx,key,delta){
  const min = key==="rest"?0:1;
  editing.items[idx][key]=Math.max(min, (editing.items[idx][key]||0)+delta);
  render();
}
function setMode(idx,mode){
  const it=editing.items[idx];
  if(it.mode===mode) return;
  it.mode=mode;
  it.value = mode==="time"?30:10;   // タイプ変更時に自然な既定値へ
  render();
}
function moveEx(idx,dir){
  const a=editing.items, j=idx+dir;
  if(j<0||j>=a.length) return;
  [a[idx],a[j]]=[a[j],a[idx]];
  render();
}

// ---- ドラッグ（スライド）で種目を並べ替え。タッチ/マウス両対応 ----
let drag = null;  // { fromIdx, cards, overIdx }
function dragStart(ev, idx){
  ev.preventDefault();
  const cards = Array.from(document.querySelectorAll(".ex-card, .ex-row"));
  if(!cards.length) return;
  drag = { fromIdx:idx, overIdx:idx, cards };
  cards[idx].classList.add("dragging");
  const onMove = (e)=>{
    const y = e.clientY;
    // 指のY座標より中心が上にあるカードの数を数える＝その位置に差し込む
    let over = 0;
    cards.forEach((c)=>{
      const r=c.getBoundingClientRect();
      if(y > r.top + r.height/2) over++;
    });
    over = Math.min(Math.max(over,0), cards.length-1);
    if(over!==drag.overIdx){
      cards.forEach(c=>c.classList.remove("drag-over"));
      if(over!==drag.fromIdx) cards[over].classList.add("drag-over");
      drag.overIdx = over;
    }
  };
  const onUp = ()=>{
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    const {fromIdx, overIdx} = drag;
    drag = null;
    if(fromIdx!==overIdx){
      const a=editing.items;
      const [moved]=a.splice(fromIdx,1);
      a.splice(overIdx,0,moved);
    }
    render();
  };
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}
function removeEx(idx){
  if(editing.items.length<=1){ alert("種目は最低1つ必要です。"); return; }
  if(!confirm(`「${editing.items[idx].name||"この種目"}」を削除しますか？`)) return;
  editing.items.splice(idx,1); render();
}
function addEx(){ const ex=newExercise(); editing.items.push(ex); expanded.add(ex.id); render(); }

// 画像アップロード（ファイル選択→縮小→dataURL）
function pickImg(idx){
  const input=document.createElement("input");
  input.type="file"; input.accept="image/*";
  input.onchange=()=>{
    const file=input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      resizeDataUrl(reader.result, 640, (small)=>{
        const label=prompt("この画像の説明（任意。例：開始姿勢）","")||"";
        editing.items[idx].imgs.push({ src:small, label:label.slice(0,16) });
        render();
      });
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function removeImg(exIdx,imgIdx){
  editing.items[exIdx].imgs.splice(imgIdx,1); render();
}
// 画像を長辺maxに縮小してJPEG化（保存容量を抑える）
function resizeDataUrl(dataUrl, max, cb){
  const im=new Image();
  im.onload=()=>{
    let {width:w,height:h}=im;
    if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
    else if(h>max){ w=Math.round(w*max/h); h=max; }
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(im,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",0.8));
  };
  im.onerror=()=>cb(dataUrl);
  im.src=dataUrl;
}

function saveEdit(){
  // 空の種目名は補完
  editing.items.forEach((it,i)=>{ if(!it.name.trim()) it.name=`種目${i+1}`; });
  const i=ROUTINES.findIndex(r=>r.id===editing.id);
  if(i>=0) ROUTINES[i]=editing; else ROUTINES.push(editing);
  saveState();
  editing=null; state.screen="home"; render();
}
function cancelEdit(){ editing=null; state.screen="home"; render(); }

loadState();
render();

// ---- Service Worker 登録（オフライン動作・ホーム画面追加のため） ----
// 新しい版を見つけたら自動で切り替え、一度だけ再読込して最新を表示する。
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", () => {
          // 既存SWがある状態で新SWが入った＝更新。即時有効化を促す。
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            sw.postMessage && reg.waiting && reg.waiting.postMessage?.({ type: "SKIP_WAITING" });
          }
        });
      });
    }).catch(() => { /* 登録失敗時も通常動作は継続 */ });

    // コントローラが切り替わったら一度だけリロードして新版を表示
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  });
}
</script>
